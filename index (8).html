    if(name&&name!==habit.name){ await sb.from('habits').update({name}).eq('id',hid); habit.name=name; }
    document.querySelectorAll('#editSubs [data-sid]').forEach(async row=>{
      let sid=row.dataset.sid; let val=row.querySelector('input').value.trim();
      let sub=subs.find(s=>s.id===sid);
      if(val&&sub&&val!==sub.name){ await sb.from('habit_subtasks').update({name:val}).eq('id',sid); sub.name=val; }
    });
    let newNames=Array.from(document.querySelectorAll('#newSubsArea input')).map(i=>i.value.trim()).filter(Boolean);
    for(let i=0;i<newNames.length;i++){
      let {data}=await sb.from('habit_subtasks').insert({habit_id:hid,name:newNames[i],sort_order:(subs.length+i)}).select().single();
      if(!STATE.subtasks[hid])STATE.subtasks[hid]=[];
      STATE.subtasks[hid].push(data);
    }
    closePanel(); renderToday();
  });
}

// WORKOUT EDITOR
function openWorkoutEditor(hid){
  let habit=STATE.habits.find(h=>h.id===hid); if(!habit)return;
  let progs=STATE.workoutPrograms[hid]||{};
  let activeP=getWorkoutProg(habit,ACTIVE_DATE);
  function buildProgBlock(prog){
    let wp=progs[prog];
    let exs=wp?STATE.workoutExercises[wp.id]||[]:[];
    return `<div id="progBlock_${prog}" style="display:${prog===activeP?'block':'none'}">
      ${exs.map(e=>`<div class="sub-input-row" data-exwid="${e.id}">
        <input class="panel-input" style="margin-bottom:0;flex:2" value="${e.name.replace(/"/g,'&quot;')}" data-exname="${e.id}"/>
        <input class="panel-input" style="margin-bottom:0;width:40px;flex:none" value="${e.default_sets}" data-exsets="${e.id}" aria-label="Подходы"/>
        <input class="panel-input" style="margin-bottom:0;width:40px;flex:none" value="${e.default_reps}" data-exreps="${e.id}" aria-label="Повторы"/>
        <button data-delex="${e.id}"><i class="ti ti-x" aria-hidden="true"></i></button>
      </div>`).join('')}
      <div class="sub-input-row">
        <input class="panel-input" style="margin-bottom:0;flex:2" id="newEx_${prog}" placeholder="Упражнение"/>
        <input class="panel-input" style="margin-bottom:0;width:40px;flex:none" id="newExSets_${prog}" value="3" aria-label="Подходы"/>
        <input class="panel-input" style="margin-bottom:0;width:40px;flex:none" id="newExReps_${prog}" value="10" aria-label="Повторы"/>
        <button id="addEx_${prog}"><i class="ti ti-plus" aria-hidden="true"></i></button>
      </div>
    </div>`;
  }
  openPanel(`
    <div class="panel-title">${habit.name}</div>
    <div class="wo-tabs" id="woEditorTabs">${['A','B','C'].map(p=>`<div class="wo-tab${p===activeP?' active':''}" data-prog="${p}">${p}</div>`).join('')}</div>
    ${['A','B','C'].map(p=>buildProgBlock(p)).join('')}
    <div class="panel-btns" style="margin-top:12px"><button class="panel-btn secondary" id="cancelBtn">Закрыть</button></div>
  `);
  document.getElementById('woEditorTabs').querySelectorAll('.wo-tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      document.querySelectorAll('.wo-tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active');
      ['A','B','C'].forEach(p=>{ let b=document.getElementById('progBlock_'+p); if(b)b.style.display=p===tab.dataset.prog?'block':'none'; });
    });
  });
  document.querySelectorAll('[data-delex]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      let eid=btn.getAttribute('data-delex');
      if(!confirm('Удалить упражнение?'))return;
      await sb.from('workout_exercises').delete().eq('id',eid);
      Object.keys(STATE.workoutExercises).forEach(pid=>{ STATE.workoutExercises[pid]=(STATE.workoutExercises[pid]||[]).filter(e=>e.id!==eid); });
      openWorkoutEditor(hid);
    });
  });
  ['A','B','C'].forEach(async prog=>{
    let addBtn=document.getElementById('addEx_'+prog);
    if(!addBtn)return;
    addBtn.addEventListener('click',async()=>{
      let name=document.getElementById('newEx_'+prog).value.trim(); if(!name)return;
      let sets=document.getElementById('newExSets_'+prog).value||'3';
      let reps=document.getElementById('newExReps_'+prog).value||'10';
      let wp=progs[prog];
      if(!wp){
        let {data}=await sb.from('workout_programs').insert({habit_id:hid,program:prog,name:'Программа '+prog,sort_order:['A','B','C'].indexOf(prog)}).select().single();
        progs[prog]=data;
        if(!STATE.workoutPrograms[hid])STATE.workoutPrograms[hid]={};
        STATE.workoutPrograms[hid][prog]=data;
        wp=data;
      }
      let n=(STATE.workoutExercises[wp.id]||[]).length;
      let {data}=await sb.from('workout_exercises').insert({program_id:wp.id,name,default_sets:sets,default_reps:reps,sort_order:n}).select().single();
      if(!STATE.workoutExercises[wp.id])STATE.workoutExercises[wp.id]=[];
      STATE.workoutExercises[wp.id].push(data);
      openWorkoutEditor(hid);
    });
  });
  document.getElementById('cancelBtn').addEventListener('click',()=>{ closePanel(); renderToday(); });
}

function openPanel(html){
  let root=document.getElementById('panelRoot');
  root.innerHTML=`<div class="side-backdrop" id="backdrop"><div class="side-panel">${html}</div></div>`;
  document.getElementById('backdrop').addEventListener('click',e=>{ if(e.target.id==='backdrop')closePanel(); });
}

// ===== ARCHIVE / MONTH NAV =====
let VIEW_MONTH = '';
function initViewMonth(){
  VIEW_MONTH = monthStr(new Date());
  updateDynMonthLabel();
}
function updateDynMonthLabel(){
  let el=document.getElementById('dynMonthLabel');
  if(!el)return;
  let p=VIEW_MONTH.split('-').map(Number);
  let names=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  el.textContent=names[p[1]-1]+' '+p[0];
  let nextBtn=document.getElementById('dynNextMonth');
  if(nextBtn) nextBtn.disabled=VIEW_MONTH>=monthStr(new Date());
}
document.getElementById('dynPrevMonth').addEventListener('click',async()=>{
  let p=VIEW_MONTH.split('-').map(Number);
  let d=new Date(p[0],p[1]-2,1);
  VIEW_MONTH=monthStr(d);
  updateDynMonthLabel();
  await loadMonthData(VIEW_MONTH);
  renderDynamic();
});
document.getElementById('dynNextMonth').addEventListener('click',async()=>{
  if(VIEW_MONTH>=monthStr(new Date()))return;
  let p=VIEW_MONTH.split('-').map(Number);
  let d=new Date(p[0],p[1],1);
  VIEW_MONTH=monthStr(d);
  updateDynMonthLabel();
  await loadMonthData(VIEW_MONTH);
  renderDynamic();
});

async function loadMonthData(ms){
  let monthStart=ms+'-01';
  let monthEnd=ms+'-'+pad(daysInMonth(ms));
  let [logRes,wlRes,mRes]=await Promise.all([
    sb.from('habit_logs').select('*').gte('log_date',monthStart).lte('log_date',monthEnd),
    sb.from('workout_logs').select('*').gte('log_date',monthStart).lte('log_date',monthEnd),
    sb.from('mood_logs').select('*').gte('log_date',monthStart).lte('log_date',monthEnd),
  ]);
  (logRes.data||[]).forEach(l=>{
    let key=l.habit_id+(l.subtask_id||'');
    if(!STATE.logs[key])STATE.logs[key]={};
    if(!STATE.logs[key][l.log_date])STATE.logs[key][l.log_date]=l;
    if(l.task_text!==null){
      if(!STATE.dynTasks[l.habit_id])STATE.dynTasks[l.habit_id]={};
      if(!STATE.dynTasks[l.habit_id][l.log_date])STATE.dynTasks[l.habit_id][l.log_date]=[];
      if(!STATE.dynTasks[l.habit_id][l.log_date].find(t=>t.id===l.id))
        STATE.dynTasks[l.habit_id][l.log_date].push(l);
    }
  });
  (wlRes.data||[]).forEach(l=>{
    if(!STATE.workoutLogs[l.exercise_id])STATE.workoutLogs[l.exercise_id]={};
    STATE.workoutLogs[l.exercise_id][l.log_date]=l;
  });
  (mRes.data||[]).forEach(m=>{ STATE.mood[m.log_date]=m; });
  // Also reload notes
  let noteRes=await sb.from('day_notes').select('*').gte('note_date',monthStart).lte('note_date',monthEnd).maybeSingle().then(()=>sb.from('day_notes').select('*').gte('note_date',monthStart).lte('note_date',monthEnd));
  if(noteRes.data) noteRes.data.forEach(n=>{ STATE.notes[n.note_date]=n; });
}

function renderDayNote(){
  let block=document.getElementById('dayNoteBlock');
  if(!block)return;
  let note=STATE.notes&&STATE.notes[ACTIVE_DATE];
  block.innerHTML=`<div class="day-note-card">
    <div class="day-note-title">Заметка дня — ${formatShort(ACTIVE_DATE)}</div>
    <textarea class="day-note-input" id="dayNoteText" placeholder="Что важного произошло сегодня?">${(note&&note.note)||''}</textarea>
    <div class="day-note-save"><button class="panel-btn primary" id="saveNoteBtn" style="padding:6px 14px;font-size:11px">Сохранить</button></div>
    ${note&&note.note?`<div class="day-note-saved">Последнее сохранение: ${formatShort(note.updated_at?note.updated_at.split('T')[0]:ACTIVE_DATE)}</div>`:''}
  </div>`;
  document.getElementById('saveNoteBtn').addEventListener('click',async()=>{
    let text=document.getElementById('dayNoteText').value.trim();
    if(!STATE.notes)STATE.notes={};
    let cur=STATE.notes[ACTIVE_DATE];
    if(cur){
      await sb.from('day_notes').update({note:text,updated_at:new Date().toISOString()}).eq('id',cur.id);
      cur.note=text;
    } else {
      let {data}=await sb.from('day_notes').insert({note_date:ACTIVE_DATE,note:text}).select().single();
      STATE.notes[ACTIVE_DATE]=data;
    }
    renderDayNote();
  });
}

// ===== УВЕДОМЛЕНИЯ =====
async function requestNotifications(){
  if(!('Notification' in window))return;
  let perm=await Notification.requestPermission();
  if(perm==='granted'){
    safeStorage('set','notifications','on');
    scheduleNotifications();
    new Notification('Трекер привычек',{body:'Уведомления включены! 🎯',icon:'/icon.svg'});
  }
}

function scheduleNotifications(){
  if(localStorage.getItem('notifications')!=='on')return;
  if(!('serviceWorker' in navigator))return;
  // Morning: 7:00, Evening: 21:00
  let now=new Date();
  function msUntil(h,m){ let t=new Date(); t.setHours(h,m,0,0); if(t<=now)t.setDate(t.getDate()+1); return t-now; }
  setTimeout(()=>{
    new Notification('Трекер привычек 🌅',{body:'Доброе утро! Время отметить утренние привычки',icon:'/icon.svg'});
    scheduleNotifications();
  }, msUntil(7,0));
  setTimeout(()=>{
    new Notification('Трекер привычек 🌙',{body:'Вечер! Не забудь оценить день и отметить вечерние привычки',icon:'/icon.svg'});
  }, msUntil(21,0));
}

function initNotifications(){
  if(safeStorage('get','notifications')==='on') scheduleNotifications();
}

// ===== СЧЁТЧИКИ =====
function buildCounterCard(habit, hi, skipped){
  let color=COLORS[hi%COLORS.length];
  let log=STATE.counterLogs&&STATE.counterLogs[habit.id]&&STATE.counterLogs[habit.id][ACTIVE_DATE];
  let val=log?parseFloat(log.value):0;
  let target=parseFloat(habit.counter_target)||0;
  let unit=habit.counter_unit||'';
  let pct=target>0?Math.min(100,Math.round(val/target*100)):0;

  let card=document.createElement('div');
  card.className='card'+(val>=target&&target>0?' done':'');
  card.setAttribute('data-hid',habit.id);
  if(!skipped)card.setAttribute('draggable','true');
  card.innerHTML=`
    <div class="card-head">
      <div class="card-icon" style="background:${color}22"><i class="ti ${habit.icon||'ti-chart-line'}" style="color:${color}" aria-hidden="true"></i></div>
      <div class="card-info">
        <div class="card-name">${habit.name}</div>
        <div class="card-meta" style="color:${color};font-weight:600">${val}${unit?'&nbsp;'+unit:''} ${target>0?'/ '+target+(unit?'&nbsp;'+unit:''):''}${target>0?' ('+pct+'%)':''}</div>
      </div>
      <div class="card-actions">
        ${skipped?'<span class="skip-label">не сегодня</span>':`
        <svg viewBox="0 0 34 34" width="34" height="34" style="flex-shrink:0">
          <circle cx="17" cy="17" r="14.5" fill="none" stroke="${color}22" stroke-width="3"/>
          <circle cx="17" cy="17" r="14.5" fill="none" stroke="${color}" stroke-width="3"
            stroke-dasharray="${2*Math.PI*14.5}" stroke-dashoffset="${2*Math.PI*14.5*(1-pct/100)}"
            stroke-linecap="round" transform="rotate(-90 17 17)"/>
        </svg>`}
        <div class="icon-btn" data-del="${habit.id}" aria-label="Удалить"><i class="ti ti-trash" aria-hidden="true"></i></div>
      </div>
    </div>
    ${!skipped?`<div class="subtasks" style="padding-top:10px">
      <div style="display:flex;align-items:center;gap:8px">
        <button class="icon-btn" data-counter-dec="${habit.id}" aria-label="Уменьшить"><i class="ti ti-minus" aria-hidden="true"></i></button>
        <input type="number" style="flex:1;text-align:center;background:var(--surface2);border:0.5px solid var(--border);border-radius:8px;padding:8px;color:#fff;font-size:16px;font-weight:700" data-counter-input="${habit.id}" value="${val}" step="${habit.counter_step||1}" min="0"/>
        <button class="icon-btn" data-counter-inc="${habit.id}" aria-label="Увеличить"><i class="ti ti-plus" aria-hidden="true"></i></button>
      </div>
      ${target>0?`<div style="margin-top:8px"><div style="height:4px;background:var(--surface2);border-radius:2px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${color};border-radius:2px"></div></div></div>`:''}
    </div>`:''}`;
  return card;
}

async function saveCounter(habitId, value){
  if(!STATE.counterLogs)STATE.counterLogs={};
  if(!STATE.counterLogs[habitId])STATE.counterLogs[habitId]={};
  let cur=STATE.counterLogs[habitId][ACTIVE_DATE];
  if(cur){
    cur.value=value;
    await sb.from('counter_logs').update({value}).eq('id',cur.id);
  } else {
    let {data}=await sb.from('counter_logs').insert({habit_id:habitId,log_date:ACTIVE_DATE,value}).select().single();
    STATE.counterLogs[habitId][ACTIVE_DATE]=data;
  }
}

function renderStreakHero(){
  // Calculate overall streak (days where ALL scheduled habits done)
  let streak=0;
  let d=new Date(TODAY);
  for(let i=0;i<90;i++){
    let ds=dateStr(d);
    let dow=d.getDay();
    let scheduled=STATE.habits.filter(h=>isScheduled(h,dow));
    if(scheduled.length===0){d.setDate(d.getDate()-1);continue;}
    let allDone=scheduled.every(h=>isFullyDone(h,ds));
    if(ds===TODAY){
      // today counts if partially done
      d.setDate(d.getDate()-1);
      continue;
    }
    if(allDone) streak++;
    else break;
    d.setDate(d.getDate()-1);
  }

  // Progress bar
  let dow=dowOf(ACTIVE_DATE);
  let scheduled=STATE.habits.filter(h=>isScheduled(h,dow));
  let done=scheduled.filter(h=>isFullyDone(h,ACTIVE_DATE)).length;
  let pct=scheduled.length?Math.round(done/scheduled.length*100):0;
  let fill=document.getElementById('dayPctFill');
  if(fill) fill.style.width=pct+'%';

  // Streak hero
  let hero=document.getElementById('streakHeroBlock');
  if(!hero)return;
  let nextMilestone=[3,7,14,21,30,60,90,180,365].find(m=>m>streak)||streak+1;
  let dotsTotal=Math.min(nextMilestone,14);
  let dots='';
  for(let i=0;i<dotsTotal;i++){
    if(i<streak) dots+='<div class="shdot done"></div>';
    else if(i===streak) dots+='<div class="shdot today"></div>';
    else dots+='<div class="shdot"></div>';
  }
  let msg=streak===0?'Начни сегодня — первый день самый важный':
    streak<3?'Хорошее начало! Не останови полосу':
    streak<7?'Идёт '+streak+' дней — до недели осталось '+(7-streak)+'!':
    streak<14?'🔥 Уже '+streak+' дней! Цель — 14':
    streak<30?'Легенда! '+streak+' дней подряд':
    '🏆 '+streak+' дней — ты машина!';
  hero.innerHTML=`<div class="streak-hero">
    <div style="font-size:38px;line-height:1">${streak>=7?'🔥':'⚡'}</div>
    <div class="streak-hero-info">
      <div class="streak-hero-lbl">Серия без пропуска</div>
      <div class="streak-hero-num">${streak} <span style="font-size:16px;color:#555;font-weight:500">дней</span></div>
      <div class="streak-hero-msg">${msg}</div>
      <div class="streak-hero-dots">${dots}</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:24px;font-weight:800;color:${pct>=100?'#2d6a4f':pct>=50?'#d97706':'#fff'}">${pct}%</div>
      <div style="font-size:9px;color:#666;text-transform:uppercase;letter-spacing:.08em">сегодня</div>
    </div>
  </div>`;

  // At-risk block
  let risk=document.getElementById('atRiskBlock');
  if(!risk)return;
  let notDone=scheduled.filter(h=>!isFullyDone(h,ACTIVE_DATE)&&ACTIVE_DATE===TODAY);
  if(notDone.length>0&&done>0&&streak>=2){
    risk.innerHTML=`<div class="at-risk">
      <i class="ti ti-alert-triangle at-risk-icon" aria-hidden="true"></i>
      <div>
        <div class="at-risk-title">Полоса под угрозой — осталось ${notDone.length} привыч${notDone.length===1?'ка':'ки'}</div>
        <div class="at-risk-sub">${notDone.slice(0,2).map(h=>h.name).join(', ')}${notDone.length>2?' и ещё '+(notDone.length-2):''}</div>
      </div>
    </div>`;
  } else {
    risk.innerHTML='';
  }
}

init();
</script>
